[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchshelf"
version = "2.0.0"
description = "Evidence-labelled project handoffs and private re-entry friction insights"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["developer-tools", "handoff", "context-switching", "workflow", "privacy", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

[project.scripts]
switchshelf = "switchshelf.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
switchshelf = ["py.typed"]
